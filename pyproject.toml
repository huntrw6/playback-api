[project]
name = "playback-api"
version = "2.2.0"
description = "Unofficial local-network API for MultiTracks Playback: events, state and optional control"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.9"
dependencies = []

[project.scripts]
playback-api = "playback_api.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["playback_api"]
